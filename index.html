<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator BBM Multi-Trip</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 15px; max-width: 450px; margin: auto; background: #f4f6f8; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2, h3 { margin-top: 0; text-align: center; }
        label { font-size: 13px; color: #555; display: block; margin-top: 10px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }
        .mode-container { background: #eef2f5; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .btn-add { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-reset { background: #dc3545; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .trip-item { background: #f8f9fa; border-left: 4px solid #007bff; padding: 10px; margin-top: 8px; border-radius: 4px; font-size: 14px; }
        .hasil-total { background: #e7f1ff; color: #084298; padding: 15px; border-radius: 8px; text-align: center; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Hitung BBM Multi-Trip</h2>
        
        <!-- Pilihan Mode Input -->
        <div class="mode-container">
            <label for="modeInput">Metode Input Jarak:</label>
            <select id="modeInput" onchange="gantiMode()">
                <option value="odometer">Odometer (KM Awal & KM Akhir)</option>
                <option value="direct">Jarak Tempuh Langsung (KM)</option>
            </select>
        </div>

        <!-- Form Input -->
        <div id="sectionOdometer">
            <label>KM Awal</label>
            <input type="number" id="kmAwal" placeholder="Contoh: 12000">
            <label>KM Akhir</label>
            <input type="number" id="kmAkhir" placeholder="Contoh: 12250">
        </div>

        <div id="sectionDirect" class="hidden">
            <label>Jarak Tempuh (KM)</label>
            <input type="number" id="jarakDirect" placeholder="Contoh: 250">
        </div>

        <label>Jumlah Isi BBM (Liter - Full to Full)</label>
        <input type="number" id="liter" step="0.01" placeholder="Contoh: 20.5">

        <button class="btn-add" onclick="tambahTrip()">+ Tambah Trip</button>
    </div>

    <!-- Daftar Trip & Hasil -->
    <div id="sectionHasil" class="card hidden">
        <h3>Riwayat & Total Rasio</h3>
        <div id="daftarTrip"></div>
        
        <div id="totalRasio" class="hasil-total"></div>
        
        <button class="btn-reset" onclick="resetSemua()">Reset Semua Trip</button>
    </div>

    <script>
        let listTrip = [];

        function gantiMode() {
            let mode = document.getElementById('modeInput').value;
            if (mode === 'odometer') {
                document.getElementById('sectionOdometer').classList.remove('hidden');
                document.getElementById('sectionDirect').classList.add('hidden');
            } else {
                document.getElementById('sectionOdometer').classList.add('hidden');
                document.getElementById('sectionDirect').classList.remove('hidden');
            }
        }

        function tambahTrip() {
            let mode = document.getElementById('modeInput').value;
            let liter = parseFloat(document.getElementById('liter').value) || 0;
            let jarak = 0;

            if (liter <= 0) {
                alert("Masukkan jumlah liter BBM dengan benar!");
                return;
            }

            if (mode === 'odometer') {
                let awal = parseFloat(document.getElementById('kmAwal').value) || 0;
                let akhir = parseFloat(document.getElementById('kmAkhir').value) || 0;
                if (akhir <= awal) {
                    alert("KM Akhir harus lebih besar dari KM Awal!");
                    return;
                }
                jarak = akhir - awal;
            } else {
                jarak = parseFloat(document.getElementById('jarakDirect').value) || 0;
                if (jarak <= 0) {
                    alert("Masukkan jarak tempuh dengan benar!");
                    return;
                }
            }

            let rasio = jarak / liter;

            // Simpan ke array
            listTrip.push({ jarak, liter, rasio });

            // Reset Form
            document.getElementById('kmAwal').value = '';
            document.getElementById('kmAkhir').value = '';
            document.getElementById('jarakDirect').value = '';
            document.getElementById('liter').value = '';

            updateTampilan();
        }

        function updateTampilan() {
            let container = document.getElementById('daftarTrip');
            let sectionHasil = document.getElementById('sectionHasil');
            container.innerHTML = '';

            if (listTrip.length === 0) {
                sectionHasil.classList.add('hidden');
                return;
            }

            sectionHasil.classList.remove('hidden');

            let totalJarak = 0;
            let totalLiter = 0;

            listTrip.forEach((trip, index) => {
                totalJarak += trip.jarak;
                totalLiter += trip.liter;

                let div = document.createElement('div');
                div.className = 'trip-item';
                div.innerHTML = `<strong>Trip #${index + 1}:</strong> ${trip.jarak.toFixed(1)} km | ${trip.liter} L 
                                 <br>-> Rasio: <strong>${trip.rasio.toFixed(2)} km/l</strong>`;
                container.appendChild(div);
            });

            let totalRasio = totalJarak / totalLiter;
            document.getElementById('totalRasio').innerHTML = `
                <strong>TOTAL GABUNGAN:</strong><br>
                Jarak: ${totalJarak.toFixed(1)} km | BBM: ${totalLiter.toFixed(2)} L<br>
                <span style="font-size: 20px;">Rata-rata: <strong>${totalRasio.toFixed(2)} km/liter</strong></span>
            `;
        }

        function resetSemua() {
            if (confirm("Hapus semua riwayat trip?")) {
                listTrip = [];
                updateTampilan();
            }
        }
    </script>
</body>
</html>
